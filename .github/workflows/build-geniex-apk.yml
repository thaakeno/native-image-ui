name: Temporary GenieX APK build

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-geniex-apk.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-34' \
            'build-tools;34.0.0' \
            'ndk;27.3.13750724'

      - name: Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Fetch latest Qualcomm app source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch main https://github.com/qualcomm/ai-hub-apps.git /tmp/ai-hub-apps
          test -f /tmp/ai-hub-apps/apps/geniex_chat_android/build.gradle
          git -C /tmp/ai-hub-apps rev-parse HEAD > AI_HUB_APPS_COMMIT.txt
          git -C /tmp/ai-hub-apps log -1 --format='%H%n%cI%n%s' > AI_HUB_APPS_SOURCE.txt

      - name: Inject official GenieX v0.4.0 Android AAR
        shell: bash
        run: |
          set -euxo pipefail
          APP=/tmp/ai-hub-apps/apps/geniex_chat_android
          mkdir -p "$APP/libs"
          curl --retry 3 --retry-delay 2 -fL \
            'https://github.com/qualcomm/GenieX/releases/download/v0.4.0/geniex-android-aar-v0.4.0.aar' \
            -o "$APP/libs/geniex-android-v0.4.0.aar"
          test -s "$APP/libs/geniex-android-v0.4.0.aar"
          sed -i "s#implementation 'com.qualcomm.qti:geniex-android:0.3.5'#implementation files('libs/geniex-android-v0.4.0.aar')#" "$APP/build.gradle"

          # ai-hub-apps main currently targets GenieX Android 0.3.5. Adapt the
          # constructor fields removed in GenieX 0.4.0 while keeping the app
          # itself at Qualcomm's latest main commit.
          sed -i '/nPast = this.nPast,/d' "$APP/src/main/java/com/geniex/demo/GenerationConfigSample.kt"
          sed -i 's/, enable_thinking = enableThinking//g' "$APP/src/main/java/com/geniex/demo/MainActivity.kt"
          sed -i '/^[[:space:]]*enable_thinking = enableThinking,[[:space:]]*$/d' "$APP/src/main/java/com/geniex/demo/MainActivity.kt"
          sed -i '/model_name = paths.model_name,/d' "$APP/src/main/java/com/geniex/demo/MainActivity.kt"

          grep -q "geniex-android-v0.4.0.aar" "$APP/build.gradle"
          ! grep -q 'nPast = this.nPast' "$APP/src/main/java/com/geniex/demo/GenerationConfigSample.kt"
          ! grep -q 'enable_thinking = enableThinking' "$APP/src/main/java/com/geniex/demo/MainActivity.kt"
          ! grep -q 'model_name = paths.model_name' "$APP/src/main/java/com/geniex/demo/MainActivity.kt"
          sha256sum "$APP/libs/geniex-android-v0.4.0.aar" > GENIEX_AAR_SHA256.txt
          printf '%s\n' \
            'GenieX runtime: v0.4.0' \
            'GenieX release commit: c9f8365c623359a5a61885f0783c8f051ba5f471' \
            'Target: Android ARM64 / Snapdragon 8 Elite Gen 5' \
            'App source: latest qualcomm/ai-hub-apps main at build time' \
            'Compatibility patch: removed 0.3.5-only constructor fields (nPast, enable_thinking, model_name)' \
            'Build type: debug APK' > BUILD_INFO.txt

      - name: Build APK
        id: build
        shell: bash
        run: |
          set +e
          cd /tmp/ai-hub-apps/apps/geniex_chat_android
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/BUILD_LOG.txt"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect result
        shell: bash
        run: |
          set -euxo pipefail
          status='${{ steps.build.outputs.status }}'
          APK=/tmp/ai-hub-apps/apps/geniex_chat_android/build/outputs/apk/debug/app-debug.apk
          if [[ "$status" != '0' || ! -f "$APK" ]]; then
            echo 'BUILD_FAILED' > BUILD_STATUS.txt
          else
            echo 'BUILD_OK' > BUILD_STATUS.txt
            cp "$APK" GenieX-Chat-v0.4.0-Snapdragon8EliteGen5.apk
            sha256sum GenieX-Chat-v0.4.0-Snapdragon8EliteGen5.apk > GenieX-Chat-v0.4.0-Snapdragon8EliteGen5.apk.sha256
            stat -c%s GenieX-Chat-v0.4.0-Snapdragon8EliteGen5.apk > APK_SIZE_BYTES.txt
          fi

      - name: Upload build result
        uses: actions/upload-artifact@v4
        with:
          name: GenieX-Chat-v0.4.0-Snapdragon8EliteGen5
          path: |
            GenieX-Chat-v0.4.0-Snapdragon8EliteGen5.apk
            GenieX-Chat-v0.4.0-Snapdragon8EliteGen5.apk.sha256
            APK_SIZE_BYTES.txt
            BUILD_STATUS.txt
            BUILD_INFO.txt
            BUILD_LOG.txt
            AI_HUB_APPS_COMMIT.txt
            AI_HUB_APPS_SOURCE.txt
            GENIEX_AAR_SHA256.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if APK did not build
        shell: bash
        run: test "$(cat BUILD_STATUS.txt)" = 'BUILD_OK'
